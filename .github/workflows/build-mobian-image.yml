name: Pull kernel artifact and build Mobian image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: mobian-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/android \
            /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          df -h /
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debos debootstrap qemu-system-x86 qemu-user \
            binfmt-support bmap-tools squashfs-tools-ng \
            android-sdk-libsparse-utils yq android-sdk-platform-tools mkbootimg \
            parted dosfstools e2fsprogs kpartx xz-utils zstd
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          df -h /

      - name: Free disk space
        run: |
         sudo apt-get clean
         sudo rm -rf /var/cache/apt/archives/*
         sudo rm -rf /var/lib/apt/lists/*

         df -h /
         df -h /var/cache/apt/archives

      

      - name: Prepare KVM access
        run: |
          test -c /dev/kvm || {
            echo "KVM device /dev/kvm is unavailable"
            exit 1
          }
          sudo chmod 644 /boot/vmlinuz-* 2>/dev/null || true
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Download latest kernel artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GH_PAT }}
          repo: kiranreddyrebel/linux-op6T
          workflow: build-kernel.yml
          workflow_conclusion: success
          name: kernel-debs
          path: _artifact_tmp

      - name: Copy kernel packages into build inputs
        run: |
          test -d _artifact_tmp
          find _artifact_tmp -type f -name '*.deb' -print -quit | grep -q .
          mkdir -p custom devices/qcom/packages
          cp -a _artifact_tmp/. custom/
          cp -a _artifact_tmp/. devices/qcom/packages/
          find custom devices/qcom/packages \
            -type f -name '*-dbg_*.deb' -delete
          rm -rf _artifact_tmp
          df -h /
          free -h

      - name: Prepare build storage
        run: |
          sudo apt-get clean
          sudo rm -rf /var/cache/apt/archives/*
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          df -h /
          df -i /

      - name: Build Mobian image
        run: |
          chmod +x ./build.sh
          ./build.sh -s -v -t sdm845 \
            -e plasma-mobile -x trixie
          df -h /
          free -h

      - name: Compress and locate image
        id: image
        run: |
          IMAGE_PATH=$(find . -maxdepth 1 -type f \
            -name 'mobian-sdm845-plasma-mobile-*.img' \
            -print -quit)

          test -n "$IMAGE_PATH" || {
            echo "No built Mobian image found"
            ls -lah
            exit 1
          }

          zstd -T2 -3 --rm "$IMAGE_PATH"
          COMPRESSED_PATH="${IMAGE_PATH}.zst"

          test -s "$COMPRESSED_PATH"
          echo "image_path=$COMPRESSED_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$COMPRESSED_PATH"
          df -h /

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobian-sdm845-plasma-mobile
          path: ${{ steps.image.outputs.image_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: Mobian OP6T Build ${{ github.run_number }}
          files: ${{ steps.image.outputs.image_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
