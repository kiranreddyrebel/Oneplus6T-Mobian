name: Pull kernel artifact and build Mobian image

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Oneplus6T-Mobian
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debos debootstrap qemu-system-x86 qemu-user \
            binfmt-support bmap-tools squashfs-tools-ng \
            android-sdk-libsparse-utils yq mkbootimg \
            parted dosfstools e2fsprogs kpartx xz-utils zstd

      - name: Enable KVM (needed by debos/fakemachine)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fix KVM and kernel permissions
        run: |
          sudo chmod 644 /boot/vmlinuz-*
          sudo chmod 666 /dev/kvm
          ls -l /boot/vmlinuz-* /dev/kvm

      - name: Download latest artifact from linux-op6T
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GH_PAT }}
          repo: kiranreddyrebel/linux-op6T
          workflow: build-kernel.yml
          workflow_conclusion: success
          name: kernel-debs
          path: _artifact_tmp


      - name: Copy into both target folders
        run: |
          mkdir -p custom
          mkdir -p devices/qcom/packages
          cp -r _artifact_tmp/* custom/
          cp -r _artifact_tmp/* devices/qcom/packages/
          
      - name: Remove debug symbol packages
        run: |
          find custom devices/qcom/packages \
            -type f -name '*-dbg_*.deb' -delete

      - name: Clean up temp folder
        run: rm -rf _artifact_tmp

      - name: Verify extraction
        run: |
          echo "custom/:"
          ls -la custom/
          echo "devices/qcom/packages/:"
          ls -la devices/qcom/packages/

      - name: Make build.sh executable
        run: chmod +x ./build.sh

      - name: Build Mobian image
        run: ./build.sh -s -v -t sdm845 -e plasma -x trixie

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add custom devices/qcom/packages
          git commit -m "Update packages from latest linux-op6T artifact" || echo "No changes"
          git push

      - name: Locate built image
        id: find_image
        run: |
          IMAGE_PATH=$(find . -maxdepth 3 -type f \( -name "*.img" -o -name "*.img.xz" -o -name "*.img.zip" \) | head -n 1)
          if [ -z "$IMAGE_PATH" ]; then
            echo "No image file found!"
            exit 1
          fi
          echo "image_path=$IMAGE_PATH" >> "$GITHUB_OUTPUT"
          echo "Found image: $IMAGE_PATH"

      - name: Create release and upload image
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mobian OP6T Build ${{ github.run_number }}
          files: ${{ steps.find_image.outputs.image_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
